; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nano_esp32

; ---------------------------------------------------------------------------
; PRODUCTION ENVIRONMENT -- the firmware running on the shipped device.
;   Build:  pio run -e nano_esp32
;   Flash:  pio run -e nano_esp32 -t upload   (Nano ESP32 over USB/DFU)
; All other environments below are bench/service diagnostics: each isolates
; one subsystem so a technician can test hardware without the full firmware.
; ---------------------------------------------------------------------------

[env:nano_esp32]
platform = espressif32@^6.9.0
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
	    -DWITH_WEB_ASSETS         ; link the embedded UI (index.html.gz + render clips) for the WiFi console
	    ; -DHIGH_SPEED_SENSORLESS=1 ; validation only: allow master commands up to 10000 RPM
	    ; -DESC_DEBUG_RELAY      ; debug only (also enables the ESCRAW passthrough): mirrors ESC serial
    ;                          to USB. Off for normal/UI use -- browser backpressure stalls the tick.
    ; -DBYPASS_DOOR_INTERLOCK ; bring-up shim (forces door "closed"). REMOVED now the door halls
    ;                          are wired -- real hall state drives interlocks + the door auto-stop.
    ;                          Re-add temporarily only to bench-spin without the door magnets present.
lib_deps =
    madhephaestus/ESP32Servo
    adafruit/Adafruit NeoPixel@^1.12.0
    dfrobot/DFRobot_DF1201S@^1.0.2
    links2004/WebSockets@^2.4.1

; High-speed validation build. Default nano_esp32 remains capped at 4000 RPM.
[env:nano_esp32_hs]
extends = env:nano_esp32
build_flags =
    ${env:nano_esp32.build_flags}
    -DHIGH_SPEED_SENSORLESS=1

; --- Service / diagnostic environments (bench tools, not the product) -------

; Gated bring-up harness from the Arduino Due prototype era (src/serial_test_mode.ino).
; Kept for reference/service; the shipped device uses the Nano ESP32.
[env:due_serial_test]
platform = atmelsam
board = due
framework = arduino
monitor_speed = 115200
build_flags = -DTEST_SERIAL

; Gantry-lock servo sweep on D10 (src/lock_sweep_test.cpp)
[env:nano_lock_test]
platform = espressif32@^6.9.0
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLOCK_SWEEP_TEST
build_src_filter = +<lock_sweep_test.cpp>
lib_deps = 
	madhephaestus/ESP32Servo

; Plain digital HIGH/LOW toggle on the lock pin (src/lock_digital_test.cpp)
[env:nano_pin_test]
platform = espressif32@^6.9.0
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLOCK_DIGITAL_TEST
build_src_filter = +<lock_digital_test.cpp>

; Door motor manual PWM drive (src/door_motor_test.cpp)
[env:door_test]
platform = espressif32@^6.9.0
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDOOR_MOTOR_TEST
build_src_filter = +<door_motor_test.cpp>

; Door motor full-voltage digital drive (src/door_digital_test.cpp)
[env:door_digi_test]
platform = espressif32@^6.9.0
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDOOR_DIGITAL_TEST
build_src_filter = +<door_digital_test.cpp>

; Door closed-loop move test: motor + hall sensors together (src/door_move_test.cpp)
[env:door_move_test]
platform = espressif32@^6.9.0
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDOOR_MOVE_TEST
build_src_filter = +<door_move_test.cpp>
