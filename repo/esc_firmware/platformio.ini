; B-G431B-ESC1 spindle ESC firmware (SimpleFOC).
; Separate PlatformIO project from the Arduino Due centrifuge firmware in ../firmware.
; Flash over the onboard ST-LINK daughterboard:  pio run -t upload
; Serial/telemetry comes back over the same daughterboard USB (USART2 VCP, 115200).

[platformio]
default_envs = b_g431_esc1

[env:b_g431_esc1]
platform = ststm32
board = disco_b_g431b_esc1
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
; CRITICAL: link SimpleFOC's objects directly instead of as a static .a archive.
; SimpleFOC's STM32/B-G431 hardware support overrides weak generic symbols
; (_configure6PWM, _configureADCLowSide, ...). Inside a static archive those
; strong overrides are NOT pulled in, so the driver + low-side current sense
; silently fall back to the generic stubs ("driver not init" / "Low-side cs not
; supported"). lib_archive=no makes strong symbols win.
lib_archive = no
lib_deps =
    ; Pinned to the exact audited version; the TIM4 encoder + bring-up behavior was
    ; verified against 2.4.0's open-loop/alignment internals.
    askuric/Simple FOC@2.4.0
build_flags =
    ; Required so SimpleFOC can use the G4 op-amps for low-side current sense.
    -D HAL_OPAMP_MODULE_ENABLED
    -D SIMPLEFOC_STM32_DEBUG
    ; Big serial TX buffer so telemetry prints queue in the background instead of
    ; blocking the loop() -- a blocked loop freezes FOC commutation and caps top speed.
    -D SERIAL_TX_BUFFER_SIZE=256

; Encoder SPI bring-up diagnostic (src/diag.cpp). Flash with:
;   pio run -d repo/esc_firmware -e diag -t upload
[env:diag]
platform = ststm32
board = disco_b_g431b_esc1
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags = -D ENCODER_DIAG
